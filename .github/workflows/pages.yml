name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar o Pages
        uses: actions/configure-pages@v5
      - name: Incluir a prancha original dos baús no próprio site
        run: |
          mkdir -p assets/secret
          curl --fail --location --retry 3 --retry-delay 2 --user-agent "Mozilla/5.0 (compatible; DELTA-RPG-site)" --output assets/secret/chest-designs-original.jpg "https://www.laurabevon.com/wp-content/uploads/2025/05/2016_laurabevon__ChestDesigns.jpg"
          file assets/secret/chest-designs-original.jpg
          test "$(stat -c%s assets/secret/chest-designs-original.jpg)" -gt 10000
      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
